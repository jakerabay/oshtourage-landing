<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oshtourage News Terminal</title>
<meta name="description" content="The Oshtourage News Terminal has been placed in the secret vault. Discover The Only Book You Need.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at top, #141b2e 0%, #0a0e1a 55%, #060810 100%);
    color: #e8eaf0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 620px;
    text-align: center;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(212, 175, 55, 0.25);
    border-radius: 20px;
    padding: 48px 32px 40px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(212, 175, 55, 0.06);
  }
  .vault-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(212,175,55,0.18), rgba(212,175,55,0.05));
    border: 1px solid rgba(212, 175, 55, 0.4);
  }
  .vault-icon svg { width: 30px; height: 30px; stroke: #d4af37; fill: none; stroke-width: 1.8; }
  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    color: #ffffff;
  }
  h1 .gold { color: #d4af37; }
  .subtitle {
    font-size: 17px;
    line-height: 1.6;
    color: #a7adbf;
    margin-bottom: 32px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 28px;
    color: #6b7194;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,0.35), transparent);
  }
  .book-title {
    font-size: 15px;
    color: #d4af37;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 14px;
    font-weight: 600;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px 20px;
    margin-bottom: 12px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-amazon {
    background: linear-gradient(135deg, #d4af37, #b8941f);
    color: #0a0e1a;
    box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
  }
  .btn-label { display: block; font-size: 13px; font-weight: 500; opacity: 0.75; margin-top: 2px; }
  .free-label {
    font-size: 15px;
    color: #a7adbf;
    margin: 26px 0 14px;
  }
  .free-label strong { color: #ffffff; }
  .social-row { display: flex; gap: 12px; }
  .social-row .btn { margin-bottom: 0; }
  .btn-youtube {
    background: rgba(255, 0, 51, 0.12);
    border: 1px solid rgba(255, 0, 51, 0.45);
    color: #ff4d6d;
  }
  .btn-tiktok {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #ffffff;
  }
  footer {
    margin-top: 32px;
    font-size: 13px;
    color: #5a6080;
  }
  @media (max-width: 480px) {
    .card { padding: 36px 22px 30px; }
    h1 { font-size: 25px; }
    .social-row { flex-direction: column; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="vault-icon">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="10" rx="2"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        <circle cx="12" cy="15" r="1.5"/>
      </svg>
    </div>
    <h1>Good news: <span class="gold">Yacob</span> did this!</h1>
    <p class="subtitle">The Oshtourage News Terminal has been placed in his secret vault.</p>

    <div class="divider">For the time being</div>

    <div class="book-title">The Only Book You Need</div>
    <a class="btn btn-amazon" href="https://a.co/d/07tH1cPH" target="_blank" rel="noopener">
      Purchase on Amazon
      <span class="btn-label">Available in hardcover</span>
    </a>

    <p class="free-label">Or <strong>listen for free</strong> on</p>
    <div class="social-row">
      <a class="btn btn-youtube" href="https://youtu.be/p6n4ymvoooc?si=gfTZ3zHW73zqPm7h" target="_blank" rel="noopener">YouTube</a>
      <a class="btn btn-tiktok" href="https://www.tiktok.com/@oshtourageacademy" target="_blank" rel="noopener">TikTok</a>
    </div>

    <footer>&copy; 2026 Oshtourage. All glory to God.</footer>
  </div>
</body>
</html>
